---
# Tasks for MSSQL build role - install SQL Server packages on CentOS/RHEL-based hosts
- name: Ensure backup directory exists
  file:
    path: "{{ backup_dir | default('/var/opt/mssql/backups') }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure data directory exists
  file:
    path: "{{ data_dir | default('/var/opt/mssql/data') }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure log directory exists
  file:
    path: "{{ log_dir | default('/var/opt/mssql/log') }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create mssql service account
  user:
    name: "{{ mssql_service_user | default('mssql') }}"
    state: present
  ignore_errors: yes

- name: Install required dependencies
  yum:
    name:
      - curl
      - wget
      - gnupg
      - libsodium
      - rsync
    state: present

- name: Add Microsoft SQL Server repository key
  rpm_key:
    key: https://packages.microsoft.com/keys/microsoft.asc
    state: present

- name: Add Microsoft SQL Server repository
  yum_repository:
    name: mssql-server
    description: Microsoft SQL Server Repository
    baseurl: https://packages.microsoft.com/rhel/8/mssql-server-{{ mssql_version }}/
    gpgcheck: yes
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc
    enabled: yes

- name: Add Microsoft MSSQL-Tools repository
  yum_repository:
    name: mssql-tools
    description: Microsoft MSSQL-Tools Repository
    baseurl: https://packages.microsoft.com/rhel/8/prod/
    gpgcheck: yes
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc
    enabled: yes

- name: Install MSSQL Server
  yum:
    name: mssql-server
    state: present

- name: Install MSSQL Tools (sqlcmd)
  yum:
    name: mssql-tools
    state: present
  environment:
    ACCEPT_EULA: "Y"

- name: Check whether MSSQL has already been configured
  stat:
    path: /var/opt/mssql/mssql.conf
  register: mssql_config

- name: Run MSSQL setup/configuration
  shell: |
    MSSQL_SA_PASSWORD='{{ sa_password }}' \
    MSSQL_PID='{{ mssql_edition }}' \
    /opt/mssql/bin/mssql-conf -n setup accept-eula
  environment:
    ACCEPT_EULA: "Y"
    MSSQL_SA_PASSWORD: "{{ sa_password }}"
    MSSQL_PID: "{{ mssql_edition }}"
  when: not mssql_config.stat.exists

- name: Enable MSSQL Server service
  systemd:
    name: mssql-server
    enabled: yes
    state: started

- name: Configure SQL Server memory limit for lab VM
  shell: |
    /opt/mssql/bin/mssql-conf set memory.memorylimitmb {{ mssql_memory_limit_mb }}
  when: not mssql_config.stat.exists

- name: Start SQL Server service
  systemd:
    name: mssql-server
    state: started

- name: Wait for SQL Server to start
  wait_for:
    port: "{{ mssql_port }}"
    delay: 10
    timeout: 180

- name: Verify MSSQL installation
  shell: |
    {{ mssql_tools_path }}/sqlcmd -S localhost -U SA -P "{{ sa_password }}" -Q "SELECT @@VERSION"
  register: version_check
  changed_when: false

- name: Display MSSQL version
  debug:
    var: version_check.stdout
